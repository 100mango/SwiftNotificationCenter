name: Swift Package Manager

on:
  push:
    branches: [master]
  release:
    types: [published]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: macOS Debug and Release
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Validate package manifest
        run: swift package dump-package
      - name: Test Debug configuration
        run: swift test --jobs 2
      - name: Test Release configuration
        run: swift test --configuration release --jobs 2
      - name: Verify public API from an external package
        if: github.event_name != 'release'
        env:
          PACKAGE_PATH: ${{ github.workspace }}
        run: bash Scripts/verify-swiftpm-consumer.sh 1.1.0
      - name: Verify released version as an external package
        if: github.event_name == 'release'
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash Scripts/verify-swiftpm-consumer.sh "$RELEASE_VERSION"
